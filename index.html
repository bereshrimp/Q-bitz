<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>큐비츠 연습하기</title>
<style>
:root{--ink:#1c1c1e;--blue:#4262ff;--line:#e0e2e8;--soft:#f7f8fa;--teal:#c3faf5;--wood:#dcb583;--gap:clamp(8px,1.4vw,24px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:'Roobert PRO',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:#fff;user-select:none;-webkit-user-select:none}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9999px;min-height:44px;padding:10px 20px;font-weight:600;touch-action:manipulation}button:hover{background:#f0f2f7}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#39393d}.blue{background:var(--blue);color:#fff;border-color:var(--blue)}.blue:hover{background:#2a41b6}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:clamp(10px,1.8vw,28px);gap:clamp(6px,1.3vh,16px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:clamp(36px,4.5vw,68px);height:clamp(36px,4.5vw,68px);object-fit:contain}h1{font-size:clamp(20px,2.5vw,38px);font-weight:600;letter-spacing:-1px;margin:0;white-space:nowrap}.eyebrow{font-size:12px;color:#6b6f7e;margin:0 0 4px}nav{display:flex;gap:6px;align-items:center}.level{padding:11px 20px}.level[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}.fullscreen{margin-left:8px;font-size:14px}.lesson{display:flex;align-items:center;justify-content:space-between;gap:10px}.level-note{margin:0;font-size:clamp(13px,1.1vw,18px);color:#555a6a}.status{font-size:14px;background:#f5f3ff;color:#2a41b6;border-radius:8px;padding:8px 12px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(150px,.65fr);gap:var(--gap);min-height:0}.panel{border:1px solid var(--line);border-radius:28px;padding:clamp(10px,1.5vw,24px);min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}.target-panel{background:#f5f3ff}.board-panel{background:#fafbfc}.pieces-panel{background:#f1fbf9}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}h2{font-size:clamp(15px,1.5vw,24px);font-weight:600;margin:0}.small{font-size:12px;color:#6b6f7e}.square-zone{flex:1;min-height:0;min-width:0;display:flex;justify-content:center;align-items:center;position:relative}.target{position:relative;flex-shrink:0;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;aspect-ratio:1}.pattern-grid{height:100%;width:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}.pattern-cell{min-height:0;min-width:0;position:relative;background:white}.target.with-lines .pattern-cell{outline:1px solid #a7aebe;outline-offset:-1px}.face{display:block;width:100%;height:100%;pointer-events:none}.card-back{position:absolute;inset:0;background:#1c1c1e;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center}.card-back[hidden]{display:none}.back-mark{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;transform:rotate(-10deg);width:34%;aspect-ratio:1}.back-mark i{display:block;background:#ffd02f;border-radius:7px}.back-mark i:nth-child(2){background:#c3faf5}.back-mark i:nth-child(3){background:#ffd8f4}.back-mark i:nth-child(4){background:#fff}.back-label{font-size:clamp(13px,1.3vw,20px)}.start{align-self:center;width:100%;min-height:48px}.start[hidden]{display:none}.actions{display:flex;gap:8px;flex-shrink:0}.actions button{flex:1;padding:10px 8px;font-size:clamp(12px,1vw,16px)}
.board{position:relative;background:var(--wood);border:clamp(7px,1.1vw,18px) solid #c39159;border-radius:12px;flex-shrink:0;aspect-ratio:1;touch-action:none}.board-grid{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}.slot{border:1px solid #b18654;min-width:0;min-height:0;position:relative;touch-action:none;background:#e8c99f;padding:0;border-radius:0;outline-offset:-4px}.slot:hover{background:#ecd2ae}.slot.empty:after{content:'';position:absolute;width:8px;height:8px;border:1px solid #b68c5d;border-radius:50%;left:calc(50% - 4px);top:calc(50% - 4px)}.slot.locked{cursor:default}.slot.drop{outline:4px solid #4262ff;outline-offset:-4px}.board.locked-board{opacity:.65}.lock-mark{position:absolute;bottom:3px;right:3px;width:13px;height:13px;background:#1c1c1e;color:white;display:grid;place-items:center;border-radius:3px;font-size:9px;pointer-events:none}.selection{position:absolute;border:4px solid var(--blue);pointer-events:none;z-index:4}.selection[hidden]{display:none}.rotate-line{position:absolute;left:50%;top:-24px;width:2px;height:20px;background:var(--blue);transform:translateX(-50%)}.rotate-handle{position:absolute;left:50%;top:-42px;transform:translateX(-50%);width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:var(--blue);border:4px solid white;pointer-events:auto;touch-action:none;color:white;font-size:23px;display:grid;place-items:center}.rotate-handle:hover{background:#2a41b6}.selection.bottom .rotate-line{top:auto;bottom:-24px}.selection.bottom .rotate-handle{top:auto;bottom:-42px}.board-help{font-size:clamp(11px,1vw,15px);color:#555a6a;text-align:center;margin:0;min-height:20px}.edit-actions{display:flex;gap:6px;justify-content:center}.edit-actions button{font-size:13px;padding:8px 14px;min-height:40px}.palette-zone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.2vw,18px);width:100%;max-width:260px}.piece-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}.piece{padding:0;border:2px solid #aab2bc;border-radius:8px;width:100%;aspect-ratio:1;min-height:0;overflow:hidden;touch-action:none;background:white}.piece[aria-pressed=true]{border:4px solid var(--blue);outline:3px solid #c3ccff;outline-offset:2px}.piece-label{font-size:clamp(10px,.85vw,13px);color:#555a6a;white-space:nowrap}.palette-help{font-size:clamp(11px,1vw,15px);color:#555a6a;line-height:1.55;margin:0}.hint{background:var(--teal);border-radius:12px;padding:12px}.footer{font-size:12px;color:#6b6f7e;display:flex;justify-content:space-between;gap:10px}.ghost{position:fixed;pointer-events:none;z-index:30;border:3px solid var(--blue);opacity:.9;transform:translate(-50%,-50%);background:#fff}.ghost[hidden]{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#1c1c1e;color:white;border-radius:12px;z-index:60;max-width:90vw;text-align:center;font-size:15px}.toast[hidden]{display:none}.success{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none}.success[hidden]{display:none}.success-card{pointer-events:auto;background:#fff;border:2px solid #00b473;border-radius:28px;padding:clamp(22px,4vw,56px);text-align:center;max-width:90vw}.success-card h2{font-size:clamp(28px,4vw,54px);margin:8px 0}.success-card p{color:#555a6a;font-size:18px}.success-tag{color:#007c51;font-weight:600}.success-buttons{display:flex;gap:10px;justify-content:center}.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall var(--duration) linear forwards;animation-delay:var(--delay)}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(680deg)}}
@media(min-width:1600px){button{min-height:54px;font-size:20px}.small{font-size:15px}.palette-help,.board-help{font-size:18px}.rotate-handle{width:52px;height:52px;top:-46px}.selection.bottom .rotate-handle{bottom:-46px}.edit-actions button{font-size:17px;min-height:44px}.footer{font-size:15px}}
@media(max-width:850px){.app{padding:10px;gap:7px}header{padding-bottom:8px}.eyebrow,.fullscreen{display:none}.brand{gap:7px}.level{padding:8px 12px;font-size:13px}main{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(110px,.65fr);gap:8px}.panel{border-radius:16px;padding:10px;gap:7px}.palette{gap:9px}.hint{padding:8px}.small{font-size:10px}.footer{font-size:10px}.edit-actions button{padding:6px 8px;font-size:11px}.status{font-size:12px;padding:6px}.piece-label{font-size:10px}}
@media(max-width:600px) and (orientation:portrait){header{flex-wrap:wrap;gap:7px}.brand{width:100%}.logo{width:34px;height:34px}h1{font-size:22px}.eyebrow{display:none}nav{width:100%}.level{flex:1;min-height:40px}.lesson{align-items:center}.level-note{font-size:11px}.status{font-size:11px}.app{padding:8px;gap:6px}main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,.78fr) minmax(0,1.22fr);gap:7px}.target-panel{grid-column:1;grid-row:1}.pieces-panel{grid-column:2;grid-row:1}.board-panel{grid-column:1/3;grid-row:2}.panel{padding:8px;gap:5px;border-radius:16px}h2{font-size:14px}.small{font-size:10px}.palette{width:auto;height:100%;aspect-ratio:2/3;gap:5px;max-width:100%;max-height:100%}.piece-wrap{min-height:0}.piece{height:100%;width:auto;max-width:100%;aspect-ratio:1}.piece-label,.palette-help,.hint,.footer .right-note{display:none}.start{min-height:34px;padding:5px;font-size:12px}.actions{gap:4px}.actions button{font-size:11px;padding:5px 3px;min-height:34px}.board-help{font-size:11px;min-height:14px}.edit-actions{position:absolute;right:8px;top:6px}.board-panel{position:relative}.edit-actions button{font-size:10px;min-height:28px;padding:4px 8px}.board-panel .panel-head{padding-right:140px}.board-panel .small{display:none}.footer{font-size:10px}.rotate-handle{width:40px;height:40px;min-height:40px;top:-35px}.selection.bottom .rotate-handle{bottom:-35px}.rotate-line{top:-18px}.selection.bottom .rotate-line{bottom:-18px}.selection{border-width:3px}}
@media(max-height:520px) and (orientation:landscape){.app{padding:7px;gap:4px}header{padding-bottom:4px}.logo{width:30px;height:30px}h1{font-size:20px}.eyebrow,.footer,.hint,.palette-help,.piece-label{display:none}.level{min-height:32px;padding:4px 14px}.fullscreen{min-height:32px;padding:4px 12px}.lesson{height:24px}.level-note{font-size:11px}.status{font-size:11px;padding:4px 8px}.panel{padding:8px;gap:4px;border-radius:14px}h2{font-size:14px}.start,.actions button{min-height:32px;padding:5px;font-size:12px}.board-help{font-size:10px;min-height:12px}.edit-actions button{min-height:28px;padding:4px 10px}.palette{width:auto;height:100%;aspect-ratio:2/3;gap:5px}.piece-wrap{min-height:0}.piece{height:100%;width:auto;max-width:100%}.app{grid-template-rows:auto auto minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.confetti i{animation-duration:.01ms!important}}

/* Hide visual labels; retain accessible piece names and live status. */
.panel-head,.piece-label{display:none!important}
#status{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);padding:0;border:0}
#pattern.seamless{display:block;background:#fff;line-height:0}
#pattern.seamless canvas{display:block;width:100%;height:100%;border:0;outline:0}
/* Shared occupied edges have no wooden border in level four. */
.board.level-four .slot:not(.empty){background:#fff}
.board.level-four .slot:not(.empty)>.face{position:absolute;inset:0;width:100%;height:100%}

</style>

<section class="panel target-panel"><div class="panel-head"><h2>문제 카드</h2><span class="small" id="cardNum">카드 01</span></div><div class="square-zone" id="targetZone"><div class="target with-lines" id="target"><div class="pattern-grid" id="pattern"></div><div class="card-back" id="cardBack"><div class="back-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span class="back-label">어떤 무늬가 나올까요?</span></div></div></div><button class="primary start" id="start">시작하기</button><div class="actions"><button id="clear">모두 지우기</button><button class="primary" id="newCard">새 카드</button></div></section>
<section class="panel board-panel"><div class="panel-head"><h2>나의 트레이</h2><span class="small" id="count">0 / 16칸</span></div><div class="square-zone" id="boardZone"><div class="board locked-board" id="board"><div class="board-grid" id="boardGrid"></div><div class="selection" id="selection" hidden><span class="rotate-line"></span><button class="rotate-handle" id="rotateHandle" aria-label="회전점을 끌어 조각 회전하기. 방향키로도 회전할 수 있습니다.">↻</button></div></div></div><div class="edit-actions"><button id="rotateButton" disabled>90° 돌리기</button><button id="deleteButton" disabled>선택 지우기</button></div><p class="board-help" id="boardHelp">시작하기를 누르면 조각을 놓을 수 있어요.</p></section>
<section class="panel pieces-panel"><div class="panel-head"><h2>조각 상자</h2><span class="small">6가지</span></div><p class="palette-help">필요한 조각을 트레이로 끌어 놓으세요.</p><div class="palette-zone" id="paletteZone"><div class="palette" id="palette"></div></div><p class="palette-help hint">조각은 계속 꺼낼 수 있어요.<br>놓은 조각을 누르면 회전점이 나타나요.</p></section>
</main><footer class="footer"><span>조각을 누른 뒤 빈칸을 눌러도 놓을 수 있어요.</span><span class="right-note">같은 무늬가 되면 자동으로 확인해요.</span></footer>
</div>
<div id="ghost" class="ghost" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<div id="success" class="success" hidden><section class="success-card" role="dialog" aria-modal="true" aria-labelledby="successTitle"><span class="success-tag">모든 무늬가 같아요.</span><h2 id="successTitle">성공! 완성했어요.</h2><p>조각의 색과 방향을 잘 맞췄어요.</p><div class="success-buttons"><button id="lookBoard">완성한 판 보기</button><button class="primary" id="nextSuccess">새 카드</button></div></section></div><div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const NAMES=['하얀색','파란색','파란 원','하얀 원','왼쪽 위 파랑 /','오른쪽 위 파랑 \\'];
const BLUE='#4262ff';
let level=1, active=false, solved=false, target=[], cells=Array(16).fill(null), selected=-1, chosen=-1, cardNumber=0, gesture=null, toastTimer, confettiTimer, returningFocus=null, holes=new Set();
const grid=$('boardGrid'), palette=$('palette');
function mod(n){return ((n%4)+4)%4;}
function face(t,q=0){
 const bg=(t===1||t===3)?BLUE:'#fff';
 let shape='';
 if(t===2||t===3)shape='<circle cx="50" cy="50" r="29" fill="'+(t===2?BLUE:'#fff')+'"/>';
 // The two blue triangles are exact left-right reflections.
 if(t===4)shape='<path d="M0 0H100L0 100Z" fill="'+BLUE+'"/>';
 if(t===5)shape='<path d="M0 0H100V100Z" fill="'+BLUE+'"/>';
 return '<svg class="face" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" fill="'+bg+'"/><g transform="rotate('+(q*90)+' 50 50)">'+shape+'</g></svg>';
}
function canonical(p){return !p?'empty':p.t<4?String(p.t):'d'+mod(p.q+(p.t===5?1:0));}
function same(a,b){return canonical(a)===canonical(b);}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function makePattern(){
 const a=shuffle(Array.from({length:16},(_,i)=>i<6?i:Math.floor(Math.random()*6)));
 const pattern=a.map(t=>({t,q:t>=4?Math.floor(Math.random()*4):0}));
 holes=new Set(level<=2?shuffle(Array.from({length:16},(_,i)=>i)).slice(0,2):[]);
 for(const i of holes){
  if(level===1){pattern[i]={t:Math.floor(Math.random()*6),q:0};}
  else {
   const t=4+Math.floor(Math.random()*2);
   // Palette orientations are d0 and d1; d2/d3 always require rotation.
   const orientation=2+Math.floor(Math.random()*2);
   pattern[i]={t,q:mod(orientation-(t===5?1:0))};
  }
 }
 return pattern;
}
for(let i=0;i<16;i++){
 let b=document.createElement('button');b.className='slot empty';b.dataset.cell=i;b.setAttribute('aria-label',(Math.floor(i/4)+1)+'행 '+(i%4+1)+'열, 빈칸');grid.appendChild(b);
}
NAMES.forEach((name,t)=>{let wrap=document.createElement('div');wrap.className='piece-wrap';wrap.innerHTML='<button class="piece" data-type="'+t+'" aria-label="'+name+' 조각 선택" aria-pressed="false">'+face(t)+'</button><span class="piece-label">'+name+'</span>';palette.appendChild(wrap);});
function fit(){
 for(const [z,id] of [['targetZone','target'],['boardZone','board']]){let r=$(z).getBoundingClientRect();let inset=id==='board'?14:0;let size=Math.max(0,Math.floor(Math.min(r.width-inset,r.height-inset)));$(id).style.width=size+'px';$(id).style.height=size+'px';}
 const pr=$('paletteZone').getBoundingClientRect();const gap=parseFloat(getComputedStyle(palette).gap)||8;const labels=getComputedStyle(palette.querySelector('.piece-label')).display==='none'?0:22;const side=Math.max(0,Math.min((pr.width-gap)/2,(pr.height-gap*2)/3-labels,118));palette.style.width=(side*2+gap)+'px';palette.style.height='auto';palette.querySelectorAll('.piece').forEach(e=>{e.style.width=side+'px';e.style.height=side+'px';});
}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2400);}
function stopGesture(){gesture=null;$('ghost').hidden=true;document.querySelectorAll('.drop').forEach(e=>e.classList.remove('drop'));}
function dismissSuccess(){ $('success').hidden=true;$('app').inert=false;$('confetti').replaceChildren();clearTimeout(confettiTimer);if(returningFocus&&returningFocus.isConnected)returningFocus.focus(); }
function prepare(){
 stopGesture();dismissSuccess();let old=target;do{target=makePattern();}while(old.length&&target.every((p,i)=>same(p,old[i])));
 active=false;solved=false;cells=Array(16).fill(null);selected=-1;chosen=-1;cardNumber++;
 $('cardNum').textContent='카드 '+String(cardNumber).padStart(2,'0');$('pattern').replaceChildren();$('pattern').classList.remove('seamless');$('cardBack').hidden=false;$('start').hidden=false;$('target').classList.toggle('with-lines',level!==4);
 $('levelNote').textContent=['','1수준 · 돌리지 않고 두 칸을 채워 보세요.','2수준 · 조각을 돌려 두 칸을 채워 보세요.','3수준 · 구분선을 보며 16칸을 완성하세요.','4수준 · 카드의 구분선 없이 무늬를 살펴보세요.'][level];
 document.querySelectorAll('.level').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===level)));render();requestAnimationFrame(fit);
}

// Render the entire level-four card onto ONE pixel surface. Each cell boundary
// is an integer canvas coordinate. There are no individual SVG viewports,
// borders, outlines, or fractional-pixel gaps between white or blue cells.
function drawSeamlessCard(){
 const host=$('pattern');
 host.classList.toggle('seamless',level===4);
 if(level!==4){
  host.innerHTML=target.map(p=>'<div class="pattern-cell">'+face(p.t,p.q)+'</div>').join('');
  return;
 }
 const canvas=document.createElement('canvas');
 canvas.width=1600;canvas.height=1600;
 canvas.setAttribute('role','img');
 canvas.setAttribute('aria-label','구분선 없는 문제 무늬');
 const ctx=canvas.getContext('2d');
 const size=400;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,1600,1600);
 target.forEach((p,i)=>{
  const x=(i%4)*size,y=Math.floor(i/4)*size;
  if(p.t===1||p.t===3){
   ctx.fillStyle=BLUE;ctx.fillRect(x,y,size,size);
  }
  if(p.t===2||p.t===3){
   ctx.fillStyle=p.t===2?BLUE:'#fff';
   ctx.beginPath();ctx.arc(x+200,y+200,116,0,Math.PI*2);ctx.fill();
  }
  if(p.t>=4){
   let points=p.t===4?[[0,0],[size,0],[0,size]]:[[0,0],[size,0],[size,size]];
   for(let q=0;q<mod(p.q);q++)points=points.map(([px,py])=>[size-py,px]);
   ctx.fillStyle=BLUE;ctx.beginPath();
   points.forEach(([px,py],j)=>{if(j===0)ctx.moveTo(x+px,y+py);else ctx.lineTo(x+px,y+py);});
   ctx.closePath();ctx.fill();
  }
 });
 host.replaceChildren(canvas);
}
function updateSharedEdges(){
 $('board').classList.toggle('level-four',level===4);
 Array.from(grid.children).forEach((b,i)=>{
  const occupied=level===4&&Boolean(cells[i]);
  const r=Math.floor(i/4),c=i%4;
  for(const [side,hasNeighbor,j] of [['Top',r>0,i-4],['Right',c<3,i+1],['Bottom',r<3,i+4],['Left',c>0,i-1]]){
   b.style['border'+side+'Width']=occupied&&hasNeighbor&&cells[j]?'0px':'';
  }
 });
}

function start(){if(active)return;active=true;drawSeamlessCard();$('pattern').setAttribute('aria-label','따라 만들 문제 무늬');$('cardBack').hidden=true;$('start').hidden=true;if(level<=2){cells=target.map((p,i)=>holes.has(i)?null:{...p,locked:true});}render();requestAnimationFrame(fit);}
function render(){
 Array.from(grid.children).forEach((b,i)=>{const p=cells[i];b.innerHTML=p?face(p.t,p.q)+(p.locked?'<span class="lock-mark" aria-hidden="true">•</span>':''):'';b.className='slot'+(!p?' empty':'')+(p?.locked?' locked':'');b.setAttribute('aria-label',(Math.floor(i/4)+1)+'행 '+(i%4+1)+'열, '+(p?NAMES[p.t]+', '+(p.q*90)+'도'+(p.locked?', 고정 조각':''):'빈칸'));b.setAttribute('aria-disabled',String(!active));});
 updateSharedEdges();
 palette.querySelectorAll('.piece').forEach(b=>{b.setAttribute('aria-pressed',String(Number(b.dataset.type)===chosen));b.setAttribute('aria-disabled',String(!active));});
 const count=cells.filter(Boolean).length;$('count').textContent=count+' / 16칸';$('status').textContent=!active?'시작을 기다리고 있어요.':solved?'무늬를 완성했어요.':count+' / 16칸을 채웠어요.';$('board').classList.toggle('locked-board',!active);
 const p=cells[selected];const editable=active&&p&&!p.locked;$('selection').hidden=!editable;$('rotateButton').disabled=!editable;$('deleteButton').disabled=!editable;
 if(editable){const s=$('selection');s.style.left=(selected%4*25)+'%';s.style.top=(Math.floor(selected/4)*25)+'%';s.style.width='25%';s.style.height='25%';s.classList.toggle('bottom',Math.floor(selected/4)===0);}
 $('boardHelp').textContent=!active?'시작하기를 누르면 조각을 놓을 수 있어요.':editable?'파란 회전점을 끌거나 90° 돌리기를 눌러 보세요.':chosen>=0?'트레이의 칸을 누르거나 조각을 끌어 놓으세요.':level<=2&&cells.some(p=>p?.locked)?'작은 점이 있는 기본 조각은 고정되어 있어요.':'조각을 놓고, 선택해서 방향을 바꿔 보세요.';
}
function check(){const win=active&&cells.every((p,i)=>p&&same(p,target[i]));if(win&&!solved){solved=true;render();celebrate();}else if(!win){solved=false;}}
function changed(){render();check();}
function celebrate(){returningFocus=document.activeElement;$('success').hidden=false;$('app').inert=true;$('lookBoard').focus();const frag=document.createDocumentFragment();for(let i=0;i<100;i++){let c=document.createElement('i');c.style.left=(Math.random()*100)+'%';c.style.background=['#4262ff','#ffd02f','#0fbcb0','#ff9999','#c3faf5'][i%5];c.style.setProperty('--duration',(2+Math.random()*1.7)+'s');c.style.setProperty('--delay',(Math.random()*.6)+'s');c.style.setProperty('--dx',(Math.random()*300-150)+'px');frag.appendChild(c);}$('confetti').appendChild(frag);clearTimeout(confettiTimer);confettiTimer=setTimeout(()=>$('confetti').replaceChildren(),4700);}
function ensureActive(){if(active)return true;toast('먼저 시작하기를 눌러 주세요.');return false;}
function chooseType(t){if(!ensureActive())return;chosen=t;selected=-1;render();}
function place(t,q,i){if(cells[i]?.locked){toast('이 조각은 고정되어 있어요. 빈칸에 놓아 주세요.');return;}cells[i]={t,q:mod(q),locked:false};selected=i;chosen=-1;changed();}
function tapCell(i){if(!ensureActive())return;if(cells[i]?.locked){chosen=-1;selected=-1;render();toast('미리 놓인 조각은 움직이지 않아요.');return;}if(chosen>=0){place(chosen,0,i);return;}selected=cells[i]?i:-1;render();}
function rotateStep(d=1){if(selected<0||!cells[selected]||cells[selected].locked)return;cells[selected].q=mod(cells[selected].q+d);changed();}
function deleteSelected(){if(selected>=0&&cells[selected]&&!cells[selected].locked){cells[selected]=null;selected=-1;changed();}}
function hitCell(x,y){let el=document.elementFromPoint(x,y);let cell=el?.closest('[data-cell]');return cell&&grid.contains(cell)?Number(cell.dataset.cell):-1;}
function begin(e){
 if(e.button!==0||gesture)return;
 const handle=e.target.closest('#rotateHandle');const piece=e.target.closest('[data-type]');const cell=e.target.closest('[data-cell]');if(!handle&&!piece&&!cell)return;
 if(!ensureActive())return;e.preventDefault();
 if(handle){if(selected<0||!cells[selected]||cells[selected].locked)return;const r=grid.children[selected].getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;gesture={kind:'rotate',id:e.pointerId,index:selected,cx,cy,last:Math.atan2(e.clientY-cy,e.clientX-cx),delta:0,q:cells[selected].q};}
 else{let index=cell?Number(cell.dataset.cell):-1;if(index>=0&&cells[index]?.locked){tapCell(index);return;}const p=piece?{t:Number(piece.dataset.type),q:0}:cells[index];gesture={kind:'drag',id:e.pointerId,source:piece?'palette':'board',index,p:p?{...p}:null,x:e.clientX,y:e.clientY,moved:false};}
 $('app').setPointerCapture(e.pointerId);
}
function move(e){
 let g=gesture;if(!g||g.id!==e.pointerId)return;e.preventDefault();
 if(g.kind==='rotate'){let angle=Math.atan2(e.clientY-g.cy,e.clientX-g.cx);let delta=angle-g.last;while(delta>Math.PI)delta-=2*Math.PI;while(delta< -Math.PI)delta+=2*Math.PI;g.delta+=delta;g.last=angle;const svg=grid.children[g.index].querySelector('svg');if(svg)svg.style.transform='rotate('+(g.delta*180/Math.PI)+'deg)';return;}
 if(!g.p)return;
 if(!g.moved&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>7){g.moved=true;const r=grid.children[0].getBoundingClientRect();$('ghost').style.width=r.width+'px';$('ghost').style.height=r.height+'px';$('ghost').innerHTML=face(g.p.t,g.p.q);$('ghost').hidden=false;}
 if(g.moved){$('ghost').style.left=e.clientX+'px';$('ghost').style.top=e.clientY+'px';const idx=hitCell(e.clientX,e.clientY);Array.from(grid.children).forEach((b,i)=>b.classList.toggle('drop',i===idx&&!cells[i]?.locked));}
}
function end(e){let g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;if($('app').hasPointerCapture(e.pointerId))$('app').releasePointerCapture(e.pointerId);$('ghost').hidden=true;document.querySelectorAll('.drop').forEach(b=>b.classList.remove('drop'));
 if(g.kind==='rotate'){if(cells[g.index])cells[g.index].q=mod(g.q+Math.round(g.delta/(Math.PI/2)));changed();return;}
 if(!g.moved){if(g.source==='palette')chooseType(g.p.t);else tapCell(g.index);return;}
 let dest=hitCell(e.clientX,e.clientY);if(dest<0){render();return;}if(cells[dest]?.locked){toast('고정된 조각 위에는 놓을 수 없어요.');render();return;}
 if(g.source==='palette')place(g.p.t,g.p.q,dest);else if(dest===g.index){selected=dest;chosen=-1;render();}else{let previous=cells[dest];cells[dest]=cells[g.index];cells[g.index]=previous;selected=dest;chosen=-1;changed();}
}
$('app').addEventListener('pointerdown',begin);$('app').addEventListener('pointermove',move);$('app').addEventListener('pointerup',end);$('app').addEventListener('pointercancel',()=>{stopGesture();render();});$('app').addEventListener('lostpointercapture',()=>{if(gesture){stopGesture();render();}});
// 키보드 및 보조기기의 click도 지원합니다. 포인터 입력은 위에서 처리합니다.
palette.addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(b&&e.detail===0)chooseType(Number(b.dataset.type));});grid.addEventListener('click',e=>{const b=e.target.closest('[data-cell]');if(b&&e.detail===0)tapCell(Number(b.dataset.cell));});
$('rotateHandle').addEventListener('click',e=>{if(e.detail===0)rotateStep();});$('rotateHandle').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();rotateStep(e.key==='ArrowLeft'||e.key==='ArrowDown'?-1:1);}});
$('start').addEventListener('click',start);$('newCard').addEventListener('click',prepare);$('nextSuccess').addEventListener('click',prepare);$('lookBoard').addEventListener('click',dismissSuccess);$('rotateButton').addEventListener('click',()=>rotateStep());$('deleteButton').addEventListener('click',deleteSelected);
$('clear').addEventListener('click',()=>{stopGesture();cells=Array(16).fill(null);selected=-1;chosen=-1;solved=false;dismissSuccess();render();toast('트레이의 모든 조각을 지웠어요.');});
 document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{level=Number(b.dataset.level);prepare();}));
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('이 브라우저에서는 기기의 전체 화면 기능을 이용해 주세요.');}catch(err){toast('브라우저 메뉴의 전체 화면 기능을 이용해 주세요.');}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면';requestAnimationFrame(fit);});
document.addEventListener('keydown',e=>{if(!$('success').hidden){if(e.key==='Escape')dismissSuccess();if(e.key==='Tab'){const bs=[$('lookBoard'),$('nextSuccess')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs[1].focus();}else if(!e.shiftKey&&document.activeElement===bs[1]){e.preventDefault();bs[0].focus();}}return;}if(e.key==='Escape'){chosen=-1;selected=-1;stopGesture();render();}if((e.key==='Delete'||e.key==='Backspace')&&selected>=0){e.preventDefault();deleteSelected();}});
new ResizeObserver(()=>requestAnimationFrame(fit)).observe($('app'));window.addEventListener('resize',fit);prepare();
</script>
</body>
</html>
